{% set name = "ptir5" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c5143325122d6625f7f74a67bd97b25c70da2e1ea15ae14234eadc7e40e5fbca

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - h5py >=3.9
    - numpy >=1.24

test:
  imports:
    - ptir5
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://github.com/photothermal/PTIR5-py
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Read-only Python library for PTIR5 files (HDF5-based format from Photothermal Spectroscopy Corp.)
  description: |
    ptir5 is a read-only Python library for PTIR5 files, the HDF5-based native
    format of Photothermal Spectroscopy Corp.'s PTIR Studio software (v5.0+).
    It provides access to measurement data as numpy arrays with lazy loading,
    typed metadata, and a navigable tree of measurements.
  dev_url: https://github.com/photothermal/PTIR5-py
  doc_url: https://github.com/photothermal/PTIR5-py

extra:
  recipe-maintainers:
    - andrew-stuart
